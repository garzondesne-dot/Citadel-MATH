<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1424">
<title>Citadel-MATH · 성채 탈환 수학 레이드</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="시타델 매스">
</head>
<body class="bg-dungeon">

<!-- 첫 화면: 역할 고르기 -->
<section id="screen-home" class="screen active">
  <div class="wrap">
    <header class="home-title framed"><h1>CITADEL<span>·MATH</span></h1><p>성채 탈환 수학 레이드 · <span id="ver"></span></p></header>
    <p id="mode" class="mode small"></p>
    <button id="btn-install" class="btn primary big" hidden>📲 앱으로 설치 (홈 화면 아이콘)</button>
    <p id="install-tip" class="install-tip small" hidden>📲 아이폰: 사파리 아래 <b>공유</b> 버튼 → <b>홈 화면에 추가</b> 하면 앱처럼 열려요.</p>
    <div class="roles">
      <button class="role on" data-role="student">🧑‍🎓<b>학생</b></button>
      <button class="role" data-role="teacher">📱<b>교사 폰</b></button>
      <button class="role" data-role="hall">🖥<b>종합상황실</b></button>
      <button class="role" data-role="prep">📋<b>수업 준비</b></button>
    </div>

    <div id="f-student" class="role-form panel framed">
      <label>수업 코드 <input id="s-code" inputmode="numeric" maxlength="6" placeholder="6자리" autocomplete="off"></label>
      <div id="s-auth"></div>
    </div>

    <div id="f-teacher" class="role-form panel framed" hidden>
      <div class="t-auth"></div>
      <div class="t-only" hidden>
        <label>차시 <select id="lesson"></select></label>
        <button id="t-new" class="btn primary big">✨ 새 수업 만들기</button>
        <button id="t-resume" class="btn" hidden></button>
        <div class="row2"><label>수업 코드로 이어서 <input id="t-code" inputmode="numeric" maxlength="6" autocomplete="off"></label><button id="t-code-go" class="btn">↩ 이어서</button></div>
        <p class="muted small">수업 코드(학생용)와 종합상황실 키(PC용)가 만들어져요. 학생 정답·도움 요청은 교사 폰에만 보여요.</p>
      </div>
    </div>

    <div id="f-hall" class="role-form panel framed" hidden>
      <div class="row2"><label>수업 코드 <input id="h-code" inputmode="numeric" maxlength="6" autocomplete="off"></label><label>종합상황실 키 <input id="h-key" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••"></label></div>
      <button id="h-go" class="btn primary big">🖥 종합상황실 열기</button>
      <p class="muted small">교실 PC·TV 화면용. 키는 교사 폰 위쪽에 있어요.</p>
    </div>
    <div id="f-prep" class="role-form panel framed" hidden>
      <div class="t-auth"></div>
      <div class="t-only" hidden>
        <label>차시 <select id="p-lesson"></select></label>
        <button id="p-go" class="btn primary big">📋 수업 준비 열기 (PC)</button>
        <p class="muted small">학생 명단 올리기 · 비밀번호 초기화 · 개념 설명 학습지 이미지 · 몬스터 체력 기준% 기본값</p>
      </div>
    </div>
    <p id="home-msg" class="ngc"></p>
    <p class="muted small center"><a href="demo.html">🧪 체험판: 가상 학생 18명과 한 화면에서 해 보기</a></p>
  </div>
</section>

<!-- 학생 (스마트폰) -->
<section id="screen-student" class="screen">
  <div class="wrap">
    <div id="st-head" class="st-head framed"></div>
    <div id="st-body"></div>
  </div>
</section>

<!-- 교사 폰 -->
<section id="screen-teacher" class="screen">
  <div class="wrap">
    <div id="t-head" class="st-head framed"></div>
    <span id="t-key" hidden></span>
    <div id="t-tabs" class="tabs"></div>
    <div id="t-body"></div>
  </div>
</section>

<!-- 종합상황실 (PC 큰 화면) -->
<section id="screen-hall" class="screen">
  <div class="hall">
    <div id="h-top" class="h-top framed"></div>
    <div class="h-main">
      <div class="h-left">
        <div id="h-arena" class="h-arena framed"></div>
        <div id="h-roster" class="h-roster"></div>
      </div>
      <aside class="h-right">
        <div id="h-side" class="panel framed"></div>
        <div id="h-ctrl" class="panel framed h-ctrl"></div>
      </aside>
    </div>
  </div>
</section>

<!-- 수업 준비 (PC) -->
<section id="screen-prep" class="screen">
  <div class="wrap wide"><div id="p-body"></div><p class="center"><a href="index.html">← 첫 화면</a></p></div>
</section>

<!-- 문제 창 (DIMENSION SLASHER 엔진) -->
<div id="quiz" class="modal hidden" role="dialog" aria-modal="true">
  <div class="quiz-box framed">
    <div class="quiz-head"><b id="quiz-card"></b><span id="quiz-formula" class="math"></span></div>
    <p id="quiz-q" class="quiz-q math"></p>
    <div id="quiz-choices" class="choices"></div>
    <div id="quiz-sol" class="sol math hidden"></div>
    <button id="quiz-next" class="btn primary hidden">해설 확인 · 계속 ▶</button>
  </div>
</div>
<div id="toast" class="toast"></div>

<script src="js/config.js"></script>
<script src="assets/manifest.js"></script>
<script src="js/engine/ui.js"></script>
<script src="js/engine/audio.js"></script>
<script src="js/engine/setgen.js"></script>
<script src="js/engine/quiz.js"></script>
<script src="js/engine/lessons.js"></script>
<script src="lessons/set-02.js"></script>
<script src="lessons/set-03.js"></script>
<script src="js/engine/art.js"></script>
<script src="js/engine/qrcode.min.js"></script>
<script src="js/engine/pwa.js"></script>
<script src="js/raid/net.js"></script>
<script src="js/raid/model.js"></script>
<script src="js/raid/actions.js"></script>
<script src="js/raid/account.js"></script>
<script src="js/raid/control.js"></script>
<script src="js/raid/student.js"></script>
<script src="js/raid/teacher.js"></script>
<script src="js/raid/hall.js"></script>
<script src="js/raid/prep.js"></script>
<script src="js/raid/app.js"></script>
</body>
</html>
