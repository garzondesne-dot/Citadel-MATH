<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<meta name="author" content="김찬우">
<title>모두의 던전 : 공통수학2</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192-m2.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-m2.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="모두의 던전">
</head>
<body class="bg-dungeon">

<!-- 시작 화면: 큰 제목 그림 + "화면을 가볍게 터치하세요" (터치하면 첫 화면으로) -->
<section id="screen-splash" class="screen">
  <div class="splash" id="splash"><p class="splash-tap">화면을 가볍게 터치하세요</p><p class="splash-ver" id="splash-ver"></p><p class="splash-by">모두의 던전™ · 만든 이 김찬우</p></div>
</section>

<!-- 첫 화면: 역할 고르기 -->
<section id="screen-home" class="screen">
  <div class="wrap">
    <header class="home-title brand-head"><h1 class="sr">모두의 던전 : 공통수학2</h1><p class="brand-ver"><span id="ver"></span></p></header>
    <p id="mode" class="mode small"></p>
    <button id="btn-install" class="mk-chip" hidden>📲 앱으로 설치</button>
    <p id="install-tip" class="install-tip small" hidden>📲 아이폰: 사파리 아래 <b>공유</b> 버튼 → <b>홈 화면에 추가</b> 하면 앱처럼 열려요.</p>
    <div class="roles">
      <button class="role on" data-role="student"><i class="menu-ic" data-ic="student"></i><b>학생</b></button>
      <button class="role" data-role="teacher"><i class="menu-ic" data-ic="teacher"></i><b>교사</b></button>
      <button class="role" data-role="hall"><i class="menu-ic" data-ic="hall"></i><b>종합상황실</b></button>
    </div>

    <div id="f-student" class="role-form panel framed">
      <div id="s-auth"></div>
    </div>

    <div id="f-teacher" class="role-form panel framed" hidden>
      <div class="t-auth"></div>
      <div class="t-only" hidden>
        <!-- 📅 오늘 수업 (2026-11-07 메뉴 정돈 · 카드 세 장: 오늘 수업 · 준비 · 관리 · ⚙ 설정) -->
        <div class="mk-card">
          <div id="t-today" class="t-today"></div>
          <div class="mk-open"><label>반 <select id="t-cls"></select></label><label class="t-lesson">차시 <select id="lesson"></select></label><button id="t-new" class="btn primary">▶ 수업 열기</button></div>
          <button id="t-resume" class="btn" hidden></button>
          <div id="t-live" class="t-live"></div>
          <details class="mk-more"><summary>🔄 코드로 이어서</summary><div class="row2"><label>수업 코드 <input id="t-code" name="class-code" inputmode="numeric" maxlength="6" autocomplete="off" data-1p-ignore data-lpignore="true"></label><button id="t-code-go" class="btn">↩ 이어서</button></div></details>
        </div>
        <div class="mk-card">
          <h3 class="mk-h">🧰 준비 · 관리</h3>
          <label class="mk-pl">준비 · 테스트할 차시 <select id="p-lesson"></select></label>
          <div class="mk-grid">
            <button id="p-go" class="btn"><i>📋</i>수업 준비</button>
            <button id="x-go" class="btn" title="학생 계정 없이 학생 폰 화면으로 이 차시를 끝까지 · 가상 친구 4명 · 기록 저장 안 함"><i>🧪</i>테스트</button>
            <button id="t-sched" class="btn"><i>📅</i>시간표</button>
            <button id="s-go" class="btn"><i>👥</i>명단</button>
            <button id="d-go" class="btn"><i>📊</i>대시보드</button>
            <button id="fb-go" class="btn"><i>💬</i>학생 의견<b class="mk-bd" id="fb-bd" hidden></b></button>
            <button id="ph-go" class="btn"><i>📷</i>사진 채점</button>
            <button id="sv-go" class="btn"><i>📝</i>설문</button>
            <button id="t-camp" class="btn" title="학생 캠프 그대로 · 모든 차시 열림 · 기록 저장 안 함"><i>🏕</i>내 캠프</button>
            <button id="t-quest" class="btn"><i>✏</i>출제 확인<b class="mk-bd" id="qs-bd" hidden></b></button>
            <button id="t-mail" class="btn"><i>📮</i>공지 · 선물</button>
          </div>
        </div>
        <details class="mk-card mk-set" id="t-set">
          <summary>⚙ 설정 · 비밀번호 · 선생님 모습 · 로그아웃</summary>
          <div class="row2 t-hallpw"><label>🖥 종합상황실 비밀번호 <input id="t-hallpw" class="masked" type="text" inputmode="numeric" maxlength="4" placeholder="비우면 수업마다 새로" autocomplete="off" data-1p-ignore data-lpignore="true"></label><button id="t-hallpw-save" class="btn">💾 저장</button></div>
          <p class="muted small">숫자 4자리를 저장하면 모든 수업이 그 비밀번호예요 (교실 PC 가 기억해서 다음부터 바로 입장). 비우고 저장하면 수업마다 무작위.</p>
          <p class="muted small">🧙 선생님 모습 · 이펙트 · 호칭은 <b>🏕 내 캠프 → 🧙 선생님 모습</b>에서 바꿔요.</p>
          <div class="t-auth-out"></div>
        </details>
      </div>
    </div>

    <div id="f-hall" class="role-form panel framed" hidden>
      <div id="h-find" class="h-find"></div>
      <details class="mk-more" id="h-manual"><summary>직접 입력 (코드 · 키)</summary>
        <div class="row2"><label>수업 코드 <input id="h-code" name="class-code" inputmode="numeric" maxlength="6" autocomplete="off" data-1p-ignore data-lpignore="true"></label><label>종합상황실 키 <input id="h-key" class="masked" type="text" name="hall-key" inputmode="numeric" maxlength="4" autocomplete="off" data-1p-ignore data-lpignore="true" placeholder="••••"></label></div>
      </details>
      <button id="h-go" class="btn primary big">🖥 종합상황실 열기</button>
      <p class="muted small mk-c">교실 PC · TV 화면용</p>
    </div>
    <p id="home-msg" class="ngc"></p>
  </div>
</section>

<!-- 모닥불 (학생 개인 대기실): 왼쪽 모루 · 가운데 모닥불 · 오른쪽 차원문 -->
<section id="screen-camp" class="screen">
  <button class="nav-back btn small camp-back">◀ 메뉴화면</button>
  <div id="camp"></div>
</section>

<!-- 학생 (스마트폰) -->
<section id="screen-student" class="screen">
  <div class="wrap">
    <button class="nav-back btn small">◀ 메뉴화면</button>
    <div id="st-head" class="st-head framed"></div>
    <div id="st-tbar"></div>
    <div id="st-combo"></div>
    <div id="st-body"></div>
  </div>
</section>

<!-- 교사 폰 -->
<section id="screen-teacher" class="screen">
  <div class="wrap">
    <button class="nav-back btn small">◀ 메뉴화면</button>
    <div id="t-head" class="st-head framed"></div>
    <div id="t-tbar"></div>
    <span id="t-key" hidden></span>
    <div id="t-tabs" class="tabs"></div>
    <div id="t-body"></div>
  </div>
</section>

<!-- 종합상황실 (PC 큰 화면) -->
<section id="screen-hall" class="screen">
  <div class="hall">
    <button class="nav-back btn small">◀ 메뉴화면</button>
    <div id="h-top" class="h-top framed"></div>
    <div id="h-tbar"></div>
    <div class="h-main">
      <aside id="h-heroes" class="panel framed h-heroes"></aside>
      <div id="h-arena" class="h-arena framed"></div>
      <aside class="h-right">
        <div id="h-side" class="panel framed"></div>
        <div id="h-ctrl" class="panel framed h-ctrl"></div>
      </aside>
    </div>
  </div>
</section>

<!-- 교사 대기공간 (v0.9.1) -->
<section id="screen-tcamp" class="screen">
  <div class="wrap"><div id="tcamp"></div></div>
</section>

<!-- 학생 관리 (교사) -->
<section id="screen-students" class="screen">
  <div class="wrap wide"><button class="nav-back btn small">◀ 메뉴화면</button><div id="sm-body"></div></div>
</section>

<!-- 📊 학급 대시보드 (교사만) -->
<section id="screen-dash" class="screen">
  <div class="wrap wide"><button class="nav-back btn small">◀ 메뉴화면</button><div id="dash-body"></div></div>
</section>

<!-- 🗓 출석부 · 📖 수업 일지 (교사만 · v0.9.7.0) -->
<section id="screen-att" class="screen">
  <div class="wrap wide"><button class="nav-back btn small">◀ 메뉴화면</button><div id="att-body"></div></div>
</section>

<!-- 보강던전 (학생 혼자 · 모닥불에서) -->
<section id="screen-bonus" class="screen">
  <div class="wrap"><div id="bonus"></div></div>
</section>

<!-- 수업 준비 (PC) -->
<section id="screen-prep" class="screen">
  <div class="wrap wide"><button class="nav-back btn small">◀ 메뉴화면</button><div id="p-body"></div></div>
</section>

<!-- 문제 창 (DIMENSION SLASHER 엔진) -->
<div id="quiz" class="modal hidden" role="dialog" aria-modal="true">
  <div class="quiz-box framed">
    <div class="quiz-head"><b id="quiz-card"></b><span id="quiz-formula" class="math"></span></div>
    <p id="quiz-q" class="quiz-q math"></p>
    <div id="quiz-choices" class="choices"></div>
    <div id="quiz-sol" class="sol math hidden"></div>
    <button id="quiz-next" class="btn primary hidden">해설 확인 · 계속 ▶</button>
  </div>
</div>
<div id="focus" class="focus-ov" hidden></div>
<div id="forge" class="forge-ov" hidden></div>
<div id="toast" class="toast"></div>
