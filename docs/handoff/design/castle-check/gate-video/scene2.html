<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap">
<style>
html,body{margin:0;background:#000;overflow:hidden}
#s{position:relative;width:1280px;height:720px;overflow:hidden;background:#03040a;font-family:"Do Hyeon","Noto Sans CJK KR",sans-serif}
#w{position:absolute;inset:0;transform-origin:50% 46%}
.bg{position:absolute;inset:0;background:center/cover;image-rendering:pixelated}
#b0{background-image:url(tv-done.png)}#b1{background-image:url(tv-e60.png)}#b2{background-image:url(tv-open.png)}
#dark{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 0 18%,#02030aee 75%)}
#glow{position:absolute;left:390px;top:40px;width:500px;height:620px;border-radius:50% 50% 12% 12%;background:radial-gradient(closest-side,#9df3ffcc,#3aa6ff55 50%,transparent 75%);mix-blend-mode:screen}
#rays{position:absolute;left:640px;top:360px;width:2200px;height:2200px;margin:-1100px;background:repeating-conic-gradient(#bff6ff66 0 3deg,transparent 3deg 14deg);border-radius:50%;mix-blend-mode:screen}
.h{position:absolute;width:160px;height:128px;background:url(back.png) 0 0/640px 4224px;image-rendering:pixelated;transform-origin:50% 100%}
.o{position:absolute;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 14px 6px #8fe9ff}
#cut{position:absolute;inset:0;background:#04050c;z-index:2500}
.f{position:absolute;background:url(faces.jpg);image-rendering:pixelated}
.bar{position:absolute;left:0;right:0;height:6px;background:#7fe3ff}
.t{position:absolute;left:0;right:0;text-align:center;color:#f4f8ff;text-shadow:0 3px 0 #000,0 0 22px #000,0 0 8px #000}
#ring{position:absolute;left:640px;top:360px;width:200px;height:200px;margin:-100px;border-radius:50%;border:14px solid #dffbff;box-shadow:0 0 60px 20px #7fe3ff,inset 0 0 40px #7fe3ff}
#fl{position:absolute;inset:0;background:#eaffff}
#vg{position:absolute;inset:0;box-shadow:inset 0 0 200px 70px #000}
</style>
<div id="s"><div id="w"><div class="bg" id="b0"></div><div class="bg" id="b1"></div><div class="bg" id="b2"></div><div id="rays"></div><div id="glow"></div><div id="dark"></div>
<div id="hs"></div><div id="os"></div></div><div id="ring"></div>
<div id="cut"></div><div id="vg"></div>
<div class="t" id="t1" style="top:600px;font-size:44px"></div><div class="t" id="t2" style="top:26px;font-size:78px;color:#ffe38a"></div>
<div id="fl"></div></div>
<script>
const $=i=>document.getElementById(i), cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), ln=(t,a,b)=>cl((t-a)/(b-a)), ez=x=>x*x*(3-2*x), rnd=(i,k=1)=>{const x=Math.sin(i*127.1+k*311.7)*43758.5453;return x-Math.floor(x)};
const GX=640, GY=400;                                  // 문 안 가운데
const N=33, H=[]; const order=[...Array(N).keys()].filter(i=>i!==7);
order.forEach((k,j)=>{const row=j<9?0:j<20?1:2, n=[9,11,12][row], idx=j-[0,9,20][row], sc=[.85,1.05,1.3][row], y=[606,650,704][row], span=[560,860,1160][row];
  const x=640+(idx-(n-1)/2)*span/(n-1)+(rnd(j)-.5)*16; const el=document.createElement('div');el.className='h';$('hs').append(el);
  H.push({el,k,x,y:y+(rnd(j,2)-.5)*10,sc,delay:rnd(j,3)*2.6,side:x<640?-1:1})});
const sage=document.createElement('div');sage.className='h';$('hs').append(sage);
const O=H.map(()=>{const o=document.createElement('div');o.className='o';$('os').append(o);return o});
const FACE=[0,3,10,18,5,23, 1,6,13,20,26,31, 2,9,16,22,28,33, 4,11,14,19,24,30];
function face(i,x,y,w,h){const d=document.createElement('div');d.className='f';const c=i%3,r=Math.floor(i/3);d.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px;background-size:${w*3}px ${h*12}px;background-position:${-c*w}px ${-r*h}px`;return d}
const END=24;
function render(t){
  const E=ez(ln(t,14.5,17.4)), open=t>=17.6, fin=ez(ln(t,22.2,23.4));             // fin = 깨끗한 「열린 문」 그림으로 돌아감
  // 배경 세 장: 꺼진 문 → 마왕성이 비침 → 열림
  $('b1').style.opacity=ez(ln(t,1.6,3.2)); $('b2').style.opacity=open?1:E*.55;
  const zoom=open?1.12-.12*fin+(1-ln(t,17.6,19))*.06: 1.02+t*.0035+E*.03, sh=(t>14.5&&t<17.6)?E*4:0;
  $('w').style.transform=`translate(${(rnd(Math.floor(t*30),5)-.5)*sh*2}px,${(rnd(Math.floor(t*30),6)-.5)*sh*2}px) scale(${zoom})`;
  $('dark').style.opacity=(open?.15:.9-.35*E)*(1-fin);
  $('glow').style.opacity=(open?.55*(1-ln(t,19,21)*.6):.08+.5*E+.05*Math.sin(t*2.4))*(1-fin); $('glow').style.transform=`scale(${.85+.35*E})`;
  $('rays').style.opacity=open?.55*Math.sin(ln(t,17.7,21.5)*Math.PI):0; $('rays').style.transform=`rotate(${t*12}deg)`;
  // 용사
  const gone=ez(ln(t,21.6,22.8));
  H.forEach((h,i)=>{const p=ez(ln(t,3+h.delay,5.2+h.delay)), x0=h.x+h.side*560, y0=h.y+240, x=x0+(h.x-x0)*p, y=y0+(h.y-y0)*p;
    const walking=p>0&&p<1, fr=walking?1+Math.floor(t*7+i)%2:3, bob=(t>14.5&&!open)?Math.sin(t*9+i)*1.5*E:0, back=open?-12*Math.sin(Math.min(1,ln(t,17.6,18.5))*Math.PI):0;
    h.el.style.cssText+=`;left:${x-80}px;top:${y-128+bob-back}px;transform:scale(${h.sc});background-position:${-fr*160}px ${-h.k*128}px;opacity:${(p>0?1:0)*(1-gone)};z-index:${Math.round(y)};filter:brightness(${.5+.35*E+(open?.45:0)})`});
  const sp=ez(ln(t,12.2,13.6)); sage.style.cssText+=`;left:${640-80}px;top:${(668-(668-580)*sp)-128}px;transform:scale(${1.3-.35*sp});background-position:${-(sp>0&&sp<1?(1+Math.floor(t*6)%2):3)*160}px ${-7*128}px;opacity:${(t>12?1:0)*(1-gone)};z-index:${Math.round(668-88*sp)+1};filter:brightness(${.85+.6*E}) drop-shadow(0 0 ${6+E*16}px #bff6ff)`;
  O.forEach((o,i)=>{const h=H[i], st=14.5+Math.pow(i/N,.6)*2.2, p=ln(t,st,st+.55), q=p*p; const x=h.x+(GX-h.x)*q, y=(h.y-70)+(GY-(h.y-70))*q-Math.sin(p*Math.PI)*60;
    o.style.cssText+=`;left:${x-5}px;top:${y-5}px;opacity:${p>0&&p<1?1:0};z-index:2000`});
  // 눈빛 컷인 8 ~ 12초
  const cut=$('cut');
  if(t>=8&&t<12.1){cut.style.opacity=1; const u=t-8; let key;
    if(u<2.1){const n=Math.floor(u/.35), w=(u-n*.35)/.35; key='a'+n; if(cut.dataset.k!==key){cut.dataset.k=key;cut.innerHTML='';const f=face(FACE[n],0,40,1280,640);f.id='cf';cut.append(f);const b1=document.createElement('div');b1.className='bar';b1.style.top='34px';const b2=b1.cloneNode();b2.style.top='680px';cut.append(b1,b2)}
      const f=$('cf'); f.style.transform=`translateX(${(1-ez(cl(w*3)))*(n%2?-1:1)*160+(n%2?1:-1)*w*24}px) scale(${1.04+w*.03})`; f.style.filter=`brightness(${1+.9*(1-cl(w*4))})`}
    else if(u<3.3){const n=Math.min(12,1+Math.floor((u-2.1)/.09)); key='b'+n; if(cut.dataset.k!==key){cut.dataset.k=key;cut.innerHTML='';for(let i=0;i<n;i++)cut.append(face(FACE[6+i],(i%4)*320,120+(Math.floor(i/4))*160,320,160))}}
    else{const n=Math.min(34,1+Math.floor((u-3.3)/.014)); key='c'+n; if(cut.dataset.k!==key){cut.dataset.k=key;cut.innerHTML='';for(let i=0;i<n;i++){const j=(i*7)%34;cut.append(face(j,(i%7)*183-1,130+(Math.floor(i/7))*92,184,92))}} cut.style.filter=`brightness(${1+ln(u,3.85,4.1)*4})`}
  }else{cut.style.opacity=0;cut.dataset.k='';cut.style.filter=''}
  // 열리는 순간: 빛 고리가 퍼짐 + 번쩍
  const v=ln(t,17.55,18.9); $('ring').style.opacity=v>0&&v<1?1-v:0; $('ring').style.transform=`scale(${.2+v*12})`; $('ring').style.zIndex=3000;
  let fl=(t>=17.5?1-ln(t,17.5,18.5):0); fl=Math.max(fl,(t>=12.05&&t<12.5)?1-ln(t,12.05,12.5):0,(t>=7.95&&t<8.2)?1-ln(t,7.95,8.2):0); $('fl').style.opacity=fl; $('fl').style.zIndex=4000;
  $('vg').style.zIndex=3500; $('vg').style.opacity=1-fin;
  const T=(a,b,s)=>t>=a&&t<b?[s,Math.min(ln(t,a,a+.4),1-ln(t,b-.4,b))]:null;
  const m=T(.6,2.2,'돌은 쌓였다.')||T(2.4,4.2,'빛은 모였다.')||T(4.6,7.6,'이제, 우리가 지은 문 앞에 선다.')||T(12.6,14.4,'현자 「…… 문을 연다.」')||T(19.6,22.2,'진짜는 12월 10일, 교실에서.');
  $('t1').textContent=m?m[0]:''; $('t1').style.opacity=m?m[1]:0; $('t1').style.zIndex=5000; $('t1').style.top=(t>18?124:44)+'px';
  const b=T(18.7,22.2,'마왕성 차원문이 열렸다'); $('t2').textContent=b?b[0]:''; $('t2').style.opacity=b?b[1]:0; $('t2').style.zIndex=5000;
  $('s').style.opacity=ln(t,0,.6);
}
render(0);
</script>
