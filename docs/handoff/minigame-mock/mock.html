// 판 단위: 알 반지름 0.9 (설계 v1 0.7 → 0.9 제안) · 판 반지름 = max(5.5, 2 + 1.2√n) 그대로 · 28명 = 8.3
const N28 = 28, BR = Math.max(5.5, 2 + 1.2 * Math.sqrt(N28)), ER = 0.9;

function edgeMarks(ox, oy, sc, W, top, bot) {

}
