<!doctype html>
<!-- 렌더: 모션 스킬 math-concept-motion(UI 데모 스타일)의 examples/ 폴더에 복사해 node <스킬>/engine/render.js <절대경로>/ui_06_22.html 출력.mp4 (../engine 을 씀) -->
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../engine/ui.css">
<script src="../engine/lib.js"></script><script src="../engine/sets.js"></script><script src="../engine/ui.js"></script><script src="../engine/uiscene.js"></script>
</head><body>
<div id="cam"></div>
<svg id="cursorLayer" width="1280" height="720"></svg>
<script>
const P = U.PAL, it = (s, c) => `<span class="it"${c ? ` style="color:${c}"` : ''}>${s}</span>`;
const IFF = `<span style="color:${P.ok};font-weight:800">⇔</span>`;
const T = (s, c) => `<b style="color:${c};font-weight:800">${s}</b>`;
// (06차시) 22 사각형의 포함 관계와 명제 — 「p이면 q이다」 = p 가 q 안에 쏙 들어가면 참, 삐져나온 반례가 있으면 거짓
// 박자표: 0 알약 · 2 클릭 → 카드 · 3 직사각형(주황) · 정사각형(파랑) 원 · 4 사각형 그림 · 5 칩 「정사각형이면 직사각형이다?」
//        7 토글 「정사각형 칠하기」 → 파랑이 주황 안에 쏙 · 8 칩 「⊂ → 참」 · 9 한 줄 · 13 토글 「반례 찾기」 → 주황 중 파랑 밖(빨강)
//        14 칩 「직사각형이면 정사각형이다 → 거짓」 · 15 한 줄 반례 · 16 비교 칩 「p → q 참 ⇔ P ⊂ Q」 · 18 퇴장 · 19 알약
const cQ = S.C(640, 300, 150), cP = S.C(590, 320, 62);
let rP, rOut, sq, rc, labs = [];
const kor = (c, x, y, s, color, size = 22) => { const e = c.put('text', { x, y, 'text-anchor': 'middle', 'font-size': size, fill: color, 'font-family': 'Pretendard', 'font-weight': 800 }); e.textContent = s; return e; };
UI.scene({
  pill: '사각형과 명제', pillW: 320,
  chipX: 200,
  chips: [[5, `${T('정사각형', P.a)}이면 ${T('직사각형', P.b)}이다 ?`],
          [8, `${it('정사각형', P.a)} ⊂ ${it('직사각형', P.b)} → ${T('참', P.ok)}`],
          [14, `${T('직사각형', P.b)}이면 ${T('정사각형', P.a)}이다 → ${T('거짓', P.no)}`],
          [16, `${it('p → q')} 참 ${IFF} ${it('P ⊂ Q')}`]],
  toggle: { x: 890, labels: ['정사각형 칠하기', '반례 찾기'], colors: [P.a, P.no] },
  cursor: [[0, 760, 470], [1, 652, 368], [3, 980, 600], [6, 1071, 522], [9, 990, 612], [12, 1031, 522], [15, 1010, 600], [18, 760, 470]], clicks: [2, 7, 13],
  tops: [[9, 12.5, '정사각형은 모두 직사각형 안에 쏙 들어간다'], [15, 18, '반례: 가로 2, 세로 1인 직사각형']],
  build(c) {
    rOut = c.region({ or: [cQ], not: [cP] }, P.no);
    rP = c.region({ or: [cP] }, P.a);
    const oQ = c.outline(cQ, P.b), oP = c.outline(cP, P.a);
    oQ.setAttribute('stroke-width', 2.5); oP.setAttribute('stroke-width', 2.5);
    labs = [kor(c, 812, 172, '직사각형', P.b), kor(c, 590, 248, '정사각형', P.a, 20)];
    // 정사각형 하나 (정사각형 원 안) · 가로 2 세로 1 직사각형 (직사각형 원 안, 정사각형 원 밖 = 반례)
    sq = c.put('rect', { x: 568, y: 312, width: 44, height: 44, fill: '#fff', stroke: '#111', 'stroke-width': 2 });
    rc = c.put('rect', { x: 680, y: 300, width: 96, height: 48, fill: '#fff', stroke: '#111', 'stroke-width': 2 });
  },
  update(t, c) {
    const W = c.win, B = c.B, e = (a) => MG.eOut(MG.prog(t, B(a), 0.3));
    labs.forEach((l, i) => l.style.opacity = e(3.4 + i * 0.2));
    sq.style.opacity = e(4); rc.style.opacity = e(4.15);
    rP.setAttribute('opacity', W(t, 7, 13.5) * 0.55);
    rOut.setAttribute('opacity', W(t, 13.5, 18) * 0.35);
    // 반례 직사각형은 13.5박부터 빨간 테두리 · 살짝 커짐
    const hot = W(t, 13.5, 18);
    rc.setAttribute('stroke', hot > 0.5 ? P.no : '#111'); rc.setAttribute('stroke-width', 2 + hot * 1.5);
    const s = 1 + 0.1 * Math.sin(Math.PI * MG.clamp((t - B(15)) / 0.4));
    rc.setAttribute('transform', `translate(728,324) scale(${s}) translate(-728,-324)`);
    sq.setAttribute('fill', W(t, 7, 13.5) > 0.5 ? '#fff' : '#fff');
  },
});
</script></body></html>
