<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><base href="../../"><title>교사용 체험판 시안 v3</title>
<!-- 2026-11-07 👩‍🏫 교사용 체험판 시안 v3 — 실제 게임 화면 캡처(tools/trial/shots) 위에 체험판에서 바뀌는 곳만 얹음
     (사용자: 「완전 왜 새롭게 만들어?」 → 실제 화면 그대로 · 전투 = 종합실 레이드 화면) · 로컬 서버(저장소 맨 위)에서 tools/trial/mock.html -->
<link rel="stylesheet" href="css/style.css">
<style>
  body { background: #070b16; color: #eef2ff; font-family: 'Noto Sans KR', sans-serif; margin: 0; padding: 16px; }
  .row { display: flex; gap: 18px; flex-wrap: wrap; }
  .cap { width: 390px; font-size: 14px; font-weight: 800; color: #ffd25a; margin: 0 0 6px; } .cap small { display: block; color: #9fb0d8; font-weight: 500; font-size: 12px; }
  .ph { width: 390px; height: 844px; position: relative; overflow: hidden; border-radius: 26px; border: 3px solid #2c4370; background: #0b1426 center / cover no-repeat; box-shadow: 0 10px 30px #0008; }
  .new { position: absolute; z-index: 5; border: 3px dashed #ff4dd2; border-radius: 12px; pointer-events: none; }
  .tag { position: absolute; z-index: 6; background: #ff4dd2; color: #fff; font-size: 11px; font-weight: 900; padding: 1px 7px; border-radius: 8px; }
  .ai { position: absolute; left: 10px; right: 10px; bottom: 12px; display: flex; gap: 8px; align-items: flex-end; z-index: 9; }
  .ai .face { width: 48px; height: 48px; border-radius: 50%; background: #1b2a48; border: 2px solid #7fd3ff; overflow: hidden; flex: none; display: flex; align-items: flex-end; justify-content: center; }
  .ai .msg { flex: 1; background: #ffffffee; color: #13203a; border-radius: 14px 14px 14px 4px; padding: 7px 10px; font-size: 13px; line-height: 1.45; box-shadow: 0 4px 12px #0007; }
  .ai .msg b { color: #c0392b; } .ai .msg .nx { float: right; margin: 3px 0 0 8px; padding: 4px 11px; border-radius: 10px; background: #f2b544; color: #2a1608; font-weight: 900; }
  /* ① 첫 화면: 용사들 앞(아래)에 이름 · 용사 6 */
  .pick { position: absolute; left: 12px; right: 12px; top: 560px; z-index: 4; padding: 10px; border-radius: 14px; background: #0b1426e8; border: 2px solid #ffd25a; }
  .pick .inp { padding: 8px 10px; border-radius: 10px; border: 2px solid #2c4370; background: #0a1020; font-size: 15px; margin-bottom: 8px; }
  .hg { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
  .hg .c { height: 66px; border-radius: 9px; background: #16223e; border: 2px solid #2c4370; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; font-size: 9.5px; overflow: hidden; }
  .hg .c .art { transform: scale(.75); transform-origin: center bottom; } .hg .c.on { border-color: #ffd25a; box-shadow: 0 0 8px #ffd25a88; }
  .go { display: block; margin-top: 8px; padding: 10px; border-radius: 12px; background: #f2b544; color: #2a1608; text-align: center; font-weight: 900; font-size: 16px; }
  .hide { position: absolute; z-index: 3; background: #0b1426; }
  /* ② · ⑤ 캠프 */
  .lock { position: absolute; z-index: 4; width: 44px; height: 44px; border-radius: 50%; background: #000c; border: 2px solid #ffffff55; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .shade { position: absolute; z-index: 3; border-radius: 16px; background: #0009; backdrop-filter: grayscale(1); }
  .gate { position: absolute; z-index: 6; right: 6px; top: 288px; padding: 5px 9px; border-radius: 10px; background: #000d; border: 2px solid #b388ff; box-shadow: 0 0 14px #b388ff; font-size: 12.5px; font-weight: 900; line-height: 1.35; text-align: center; }
  .gate small { display: block; font-weight: 700; color: #ffd25a; font-size: 11px; }
  .nb { position: absolute; z-index: 6; padding: 1px 6px; border-radius: 8px; background: #2f7bff; font-size: 10.5px; font-weight: 900; }
  .banner { position: absolute; left: 14px; right: 14px; top: 56px; z-index: 6; padding: 9px; border-radius: 12px; background: linear-gradient(90deg, #3a2a06f0, #0a2c46f0); border: 2px solid #ffd25a; text-align: center; font-size: 14px; font-weight: 800; }
  /* ④ 전투 = 종합실 레이드 화면 + 아래 내 문제 */
  .arena { position: absolute; left: 0; top: 0; width: 390px; height: 470px; background: #000 center top / 390px auto no-repeat; }
  .qz { position: absolute; left: 0; right: 0; top: 470px; bottom: 0; background: #0b1426 center -455px / 390px auto no-repeat; }
</style></head>
<body>
<div class="row" id="r1"></div>
<div class="row" id="r2" style="margin-top:22px"></div>
<script src="js/config.js"></script>
<script src="assets/manifest.js"></script>
<script src="js/engine/art.js"></script>
<script>
const A = DS.ASSETS, H = (n, p = 'idle') => DS.Art.hero(n, p), shot = (n) => `url('tools/trial/shots/${n}.webp')`;
const ai = (t, nx) => `<div class="ai"><div class="face">${H(7)}</div><div class="msg"><b>AI 선생님</b> · ${t}${nx ? `<span class="nx">${nx}</span>` : ''}</div></div>`;
const frame = (cap, sub, html, bg) => `<div><p class="cap">${cap}<small>${sub}</small></p><div class="ph" style="${bg ? `background-image:${shot(bg)}` : ''}">${html}</div></div>`;
const mark = (x, y, w, h, t, tx = x, ty = y - 14) => `<div class="new" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"></div>${t ? `<span class="tag" style="left:${tx}px;top:${ty}px">${t}</span>` : ''}`;
const f1 = frame('① 첫 화면 (실제 그대로)', '용사들 앞(아래)에 이름 · 용사 6명만 얹음 — 메뉴 화면(학생 · 교사 · 종합실)은 건너뜀',
  `<div class="hide" style="left:0;right:0;top:640px;height:90px;background:transparent"></div>
  <div class="pick"><div class="inp">이름 &nbsp;<b>김선생</b><span style="opacity:.5">|</span></div>
  <div class="hg">${[0, 1, 2, 3, 21, 23].map((n, i) => `<div class="c${i === 0 ? ' on' : ''}">${H(n)}<span>${A.heroesV2.list[n].name}</span></div>`).join('')}</div>
  <span class="go">⚔ 모험 시작</span></div>${mark(8, 552, 374, 240, '체험판에서 바뀜', 14, 538)}`, 'real-splash');
const f2 = frame('② 첫 캠프 (실제 학생 캠프 그대로)', '성채 · 텐트 · 우편함 · 허수아비만 🔒 · 던전 관문만 빛남 + 수업 내용 이름표',
  `<div class="shade" style="left:118px;top:52px;width:180px;height:150px"></div><div class="lock" style="left:186px;top:105px">🔒</div>
  <div class="shade" style="left:44px;top:226px;width:86px;height:60px"></div><div class="lock" style="left:66px;top:234px">🔒</div>
  <div class="shade" style="left:146px;top:256px;width:36px;height:36px"></div><div class="lock" style="left:142px;top:252px">🔒</div>
  <div class="shade" style="left:266px;top:310px;width:40px;height:44px"></div><div class="lock" style="left:264px;top:310px">🔒</div>
  <div class="gate">⚔ 6차시 입장!<small>드모르간의 법칙 · 집합 마무리</small></div>${mark(258, 196, 128, 140, '관문 이름표', 262, 182)}
  ${ai('오늘 수업 던전 관문이 열렸어요! 빛나는 <b>문</b>을 눌러 들어가요. 🔒 곳들은 수업이 끝나면 열려요.')}`, 'real-camp');
const f3 = frame('③ 대기실 · 개념 · 영상 (실제 그대로)', '가상 동료 8명이 하나둘 입장 · 아래 AI 선생님 말풍선만 더함',
  `${ai('친구들이 모이고 있어요. 다 모이면 <b>개념 설명</b> → <b>영상</b> 순서로 갈게요.', '다음 ▶')}`, 'real-lobby');
const f4 = frame('④ 전투 = 종합실 레이드 화면', '위: 실제 종합실 레이드(몬스터 가운데 · 용사들 아래) · 아래: 내 문제 칸(실제 그대로)',
  `<div class="arena" style="background-image:${shot('real-hall-arena-phone')}"></div><div class="qz" style="background-image:${shot('real-raid')}"></div>
  ${mark(4, 4, 382, 462, '전투 장면 = 종합실', 10, 8)}${ai('다 같이 공격 중! 틀려도 숫자만 바뀌어 다시. 다 풀면 넘어가요.', '다음 ▶')}`);
const f5 = frame('⑤ 수업 끝 → 캠프가 열림 (실제 캠프)', '🔒 풀림 · 6차시 복습(허수아비 · 우편함 · 텐트 책장) · 성채 · 💎100',
  `<div class="banner">🏆 수업 끝! 캠프가 열렸어요 · 🎁 체험 💎100</div>
  <span class="nb" style="left:190px;top:200px">NEW 성채</span><span class="nb" style="left:52px;top:286px">NEW 책장 6차시</span><span class="nb" style="left:132px;top:296px">NEW 우편함 2</span><span class="nb" style="left:250px;top:356px">NEW 허수아비 6차시</span>
  <div class="gate" style="border-color:#7fd3ff;box-shadow:none">⚔ 6차시 다시 하기<small>오늘 수업 복습</small></div>
  ${ai('수고했어요! 📮 우편함엔 <b>방금 틀린 문제</b>가 있어요. 🎯 허수아비에서 숫자만 바꿔 다시 풀어 봐요.')}`, 'real-camp');
document.getElementById('r1').innerHTML = f1 + f2 + f3;
document.getElementById('r2').innerHTML = f4 + f5;
</script>
</body></html>
